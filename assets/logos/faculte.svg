<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <!-- Arrière-plan blanc pour contraste sur tout thème -->
  <rect width="1000" height="200" rx="24" fill="#FFFFFF" />
  
  <g id="FST-Emblem" fill="#A71966">
    <!-- Symbole FST : angle supérieur -->
    <path d="M 62 24 L 126 24 L 126 95 L 94 95 L 94 56 L 62 56 Z" />
    
    <!-- Symbole FST : courbe inférieure en crochet -->
    <path d="M 33 607 C 18 585 24 570 34 559 C 43 549 57 549 68 563" />
    <!-- Forme principale du monogramme FST -->
    <path d="M 62 24 H 126 V 95 H 94 V 56 H 62 V 110 C 62 135 77 150 102 150 C 117 150 126 142 126 142 L 132 170 C 132 170 117 178 95 178 C 58 178 32 153 32 114 V 24 H 62 Z" />
    <rect x="131" y="104" width="28" height="74" />
  </g>

  <!-- Typographie FST : FACULTÉ DES SCIENCES ET TECHNOLOGIES -->
  <g id="FST-Text" fill="#1C1B1B" font-family="&#39;Montserrat&#39;, &#39;Century Gothic&#39;, &#39;Trebuchet MS&#39;, sans-serif">
    <text x="180" y="58" font-size="34" font-weight="900" letter-spacing="1.5">FACULTÉ</text>
    <text x="180" y="105" font-size="30.5" font-weight="800" letter-spacing="0.5">DES SCIENCES ET</text>
    <text x="180" y="153" font-size="30.5" font-weight="800" letter-spacing="0.5">TECHNOLOGIES</text>
  </g>

  <!-- Ligne de séparation verticale -->
  <line x1="505" y1="20" x2="505" y2="175" stroke="#1C1B1B" stroke-width="2.5" />

  <!-- Logo Université de Lille -->
  <g id="ULille-Logo" fill="#000000">
    <!-- Emblème U / L triple épaisseur -->
    <g transform="translate(565, 30)">
      <!-- Ligne extérieure -->
      <path d="M 0 0 H 13 V 90 C 13 118 35 130 63 130 H 87 V 117 H 63 C 42 117 26 108 26 90 V 0 H 0 Z" />
      <!-- Ligne intermédiaire -->
      <path d="M 28 0 H 41 V 80 C 41 97 53 105 70 105 H 94 V 92 H 70 C 60 92 54 86 54 78 V 0 H 28 Z" />
      <!-- Ligne intérieure -->
      <path d="M 56 0 H 69 V 68 C 69 77 75 80 84 80 H 108 V 67 H 84 C 82 67 82 66 82 64 V 0 H 56 Z" />
    </g>

    <!-- Texte Université de Lille -->
    <text x="685" y="86" font-family="&#39;Montserrat&#39;, &#39;Century Gothic&#39;, &#39;Helvetica Neue&#39;, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.5">Université</text>
    <text x="685" y="152" font-family="&#39;Montserrat&#39;, &#39;Century Gothic&#39;, &#39;Helvetica Neue&#39;, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.5">de Lille</text>
  </g>
</svg>