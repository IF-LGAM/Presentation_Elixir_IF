<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Arrière-plan grille discrète -->
  <rect width="880" height="320" rx="10" fill="none"/>

  <!-- Nœud 1 : Client / Requête -->
  <g transform="translate(40, 90)">
    <rect width="180" height="130" rx="8" fill="#1F1F1F" stroke="#333333" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="180" height="6" rx="3" fill="#E50914"/>
    <text x="90" y="45" font-family="Montserrat, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">Clients Web</text>
    <text x="90" y="70" font-family="Inter, sans-serif" font-size="11" fill="#A3A3A3" text-anchor="middle">Navigateurs / Mobiles</text>
    <text x="90" y="95" font-family="Fira Code, monospace" font-size="10" fill="#10B981" text-anchor="middle">HTTP / WebSocket</text>
  </g>

  <!-- Flèche 1 -> 2 -->
  <path d="M 230 155 L 310 155" stroke="#E50914" stroke-width="2.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <polygon points="315,155 305,150 305,160" fill="#E50914"/>

  <!-- Nœud 2 : Routeur / Dispatcher -->
  <g transform="translate(325, 60)">
    <rect width="230" height="190" rx="8" fill="#1F1F1F" stroke="#E50914" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="230" height="30" rx="8" fill="url(#grad1)"/>
    <text x="115" y="22" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" fill="#E50914" text-anchor="middle">MOTEUR DISTRIBUÉ</text>
    
    <!-- Sous-processus 1 -->
    <rect x="20" y="45" width="190" height="36" rx="4" fill="#2B2B2B" stroke="#444444"/>
    <text x="115" y="68" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF" text-anchor="middle">Micro-processus #1 (Isolé)</text>
    
    <!-- Sous-processus 2 -->
    <rect x="20" y="90" width="190" height="36" rx="4" fill="#2B2B2B" stroke="#444444"/>
    <text x="115" y="113" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF" text-anchor="middle">Micro-processus #2 (Isolé)</text>

    <!-- Superviseur -->
    <rect x="20" y="135" width="190" height="40" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981"/>
    <text x="115" y="160" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#10B981" text-anchor="middle">Superviseur OTP (Surveillance)</text>
  </g>

  <!-- Flèche 2 -> 3 -->
  <path d="M 565 155 L 645 155" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="650,155 640,150 640,160" fill="#10B981"/>

  <!-- Nœud 3 : Stockage / Cluster -->
  <g transform="translate(660, 90)">
    <rect width="180" height="130" rx="8" fill="#1F1F1F" stroke="#333333" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="180" height="6" rx="3" fill="#10B981"/>
    <text x="90" y="45" font-family="Montserrat, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">Grappe Distribuée</text>
    <text x="90" y="70" font-family="Inter, sans-serif" font-size="11" fill="#A3A3A3" text-anchor="middle">Base &amp; Cache Clé-Valeur</text>
    <text x="90" y="95" font-family="Fira Code, monospace" font-size="10" fill="#8B5CF6" text-anchor="middle">Résilience 99.9999%</text>
  </g>
</svg>
