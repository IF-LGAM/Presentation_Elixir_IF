name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Autorise le déploiement sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# N'autorise qu'un seul déploiement concurrent
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléversement des artefacts statiques
        uses: actions/upload-pages-artifact@v3
        with:
          # Déploie l'intégralité du dépôt (index.html, template_presentation.html, src, assets)
          path: '.'

      - name: Déploiement vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
